<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="spooky bat skies">
<defs>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="minimoon" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF3E0" stop-opacity=".9"/><stop offset="1" stop-color="#FFF3E0" stop-opacity="0"/></radialGradient>
<g id="bat">
<path d="M0 0 Q10 -11 20 0 Q30 -11 40 0 Q30 7 20 13 Q10 7 0 0 Z" fill="#1A0B00" stroke="#7A2E00" stroke-width="1.5" filter="url(#glow)">
<animate attributeName="d" values="M0 0 Q10 -11 20 0 Q30 -11 40 0 Q30 7 20 13 Q10 7 0 0 Z;M0 0 Q10 7 20 0 Q30 7 40 0 Q30 12 20 18 Q10 12 0 0 Z;M0 0 Q10 -11 20 0 Q30 -11 40 0 Q30 7 20 13 Q10 7 0 0 Z" dur="0.32s" repeatCount="indefinite"/>
</path>
<circle cx="20" cy="5" r="2.4" fill="#FF6B00"><animate attributeName="opacity" values="1;0.3;1" dur="0.32s" repeatCount="indefinite"/></circle>
<circle cx="18.4" cy="4.5" r="0.7" fill="#000"/><circle cx="21.6" cy="4.5" r="0.7" fill="#000"/>
</g>
<g id="eyes"><ellipse rx="5" ry="7" fill="#FFE58A"><animate attributeName="ry" values="7;1;7" dur="2.8s" repeatCount="indefinite"/></ellipse><circle r="2" fill="#1A0B00"/></g>
</defs>
<rect width="900" height="110" fill="#FF6B00"/>
<rect width="900" height="110" fill="#FF8C00" opacity="0.35"/>
<circle cx="840" cy="28" r="40" fill="url(#minimoon)"/><circle cx="840" cy="28" r="17" fill="#FFF3E0"><animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/></circle>
<g opacity="0.95">
<use href="#bat"><animateTransform attributeName="transform" type="translate" values="-60 22;960 44" dur="8s" repeatCount="indefinite"/></use>
<use href="#bat" transform="scale(0.7)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-60 72;960 34" dur="11s" begin="-3s" repeatCount="indefinite"/></use>
<use href="#bat" transform="scale(1.3)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-90 88;940 82" dur="6.5s" begin="-1.5s" repeatCount="indefinite"/></use>
<use href="#bat" transform="scale(0.5)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-50 30;950 92" dur="14s" begin="-6s" repeatCount="indefinite"/></use>
<use href="#bat" transform="scale(0.9)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-70 55;950 18" dur="9s" begin="-4.5s" repeatCount="indefinite"/></use>
<use href="#bat" transform="scale(0.65)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-55 40;955 66" dur="12s" begin="-7s" repeatCount="indefinite"/></use>
<use href="#bat" transform="scale(1.05)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-80 78;945 96" dur="7.5s" begin="-2.2s" repeatCount="indefinite"/></use>
<use href="#bat" transform="scale(0.45)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-45 14;950 58" dur="16s" begin="-9s" repeatCount="indefinite"/></use>
<use href="#bat" transform="scale(0.8)"><animateTransform attributeName="transform" type="translate" additive="sum" values="-65 64;950 12" dur="10s" begin="-5.2s" repeatCount="indefinite"/></use>
</g>
<g transform="translate(70,26)" opacity="0.9"><use href="#eyes"><animateTransform attributeName="transform" type="translate" values="0,0;6,0;0,0" dur="4s" repeatCount="indefinite"/></use></g>
<g transform="translate(660,84)" opacity="0.75"><use href="#eyes"><animateTransform attributeName="transform" type="translate" values="0,0;-6,0;0,0" dur="5s" begin="-1.5s" repeatCount="indefinite"/></use></g>
<g fill="#1A0B00" opacity="0.85">
<circle cx="100" cy="86" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/><animate attributeName="cy" values="86;34" dur="1.6s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="88" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="cy" values="88;30" dur="2.1s" begin="-0.7s" repeatCount="indefinite"/></circle>
<circle cx="470" cy="86" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="cy" values="86;26" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/></circle>
<circle cx="740" cy="88" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="-1.3s" repeatCount="indefinite"/><animate attributeName="cy" values="88;32" dur="2.4s" begin="-1.3s" repeatCount="indefinite"/></circle>
</g>
<rect y="102" width="900" height="8" fill="#1A0B00" opacity="0.25"/>
<text x="450" y="99" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="7" fill="#1A0B00" opacity="0.8">SPOOKY SKIES<animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.6s" repeatCount="indefinite"/></text>
</svg>
